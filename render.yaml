services:
  - type: web
    name: sprintgrid-api
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate --schema prisma/schema.prisma && npm run build --workspace=@sprintgrid/api
    startCommand: npx prisma migrate deploy --schema prisma/schema.prisma && node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 10000
      - key: DATABASE_URL
        value: file:/data/dev.db
      - key: WEB_ORIGIN
        value: https://sprint-grid-kpit-assignment-82pfecrs5.vercel.app
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: sqlite-db
      mountPath: /data
      sizeGB: 1
